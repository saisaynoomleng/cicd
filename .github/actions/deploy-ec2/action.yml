name: Deploy EC2
description: Pull image from AWS ECR and deploy container on EC2 using SSM

inputs:
  aws-access-key-id:
    description: AWS IAM user access key ID
    required: true

  aws-secret-access-key:
    description: AWS IAM user secret access key
    required: true

  aws-region:
    description: AWS region
    required: false
    default: us-east-2

  ec2-instance-id:
    description: EC2 instance ID
    required: true

  ecr-uri:
    description: AWS ECR registry URI
    required: true

  image-name:
    description: Docker image name
    required: false
    default: cicd

  image-tag:
    description: Docker image tag
    required: false
    default: latest

  container-name:
    description: Docker container name
    required: false
    default: cicd

runs:
  using: composite
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - name: AWS login
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.AWS_REGION }}

    - name: Send AWS SSM Command
      shell: bash
      run: |
        COMMAND_ID=$(aws ssm send-command \
           --region "$AWS_REGION" \
           --instance-ids "$EC2_INSTANCE_ID" \
           --document-name "AWS-RunShellScript" \
           --parameters commands="[
             \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY\",
             \"docker pull $ECR_REGISTRY/$ECR_REPO:latest\",
             \"docker stop $CONTAINER_NAME || true\",
             \"docker rm $CONTAINER_NAME || true\",
             \"docker run -d --name $CONTAINER_NAME --restart unless-stopped -p 3000:3000 $ECR_REGISTRY/$ECR_REPO:latest\"
           ]" \
           --query "Command.CommandId" \
           --output text)

         echo "SSM command ID: $COMMAND_ID"

         aws ssm wait command-executed \
           --region "$AWS_REGION" \
           --command-id "$COMMAND_ID" \
           --instance-id "$EC2_INSTANCE_ID"

         aws ssm get-command-invocation \
           --region "$AWS_REGION" \
           --command-id "$COMMAND_ID" \
           --instance-id "$EC2_INSTANCE_ID"
