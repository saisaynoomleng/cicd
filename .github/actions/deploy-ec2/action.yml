name: Deploy EC2
description: Pull image from AWS EC2 and run a container

inputs:
  aws-access-key-id:
    description: AWS IAM user access key ID
    required: true

  aws-secret-access-key:
    description: AWS IAM user secret access key
    required: true

  aws-region:
    description: AWS region
    required: false
    default: us-east-2

  image-name:
    description: Image Name
    required: false
    default: cicd

  image-tag:
    description: Image Tag
    required: false
    default: latest

  ecr-uri:
    description: ECR repo URI
    required: true

  container-name:
    description: Docker container name
    required: false
    default: cicd

runs:
  using: composite
  steps:
    - name: Deploy on EC2
      shell: bash
      env:
        AWS_REGION: ${{ inputs.aws-region }}
        EC2_INSTANCE_ID: ${{ inputs.ec2-instance-id }}
        ECR_REGISTRY: ${{ inputs.ecr-registry }}
        ECR_REPO: ${{ inputs.ecr-repo }}
        CONTAINER_NAME: ${{ inputs.container-name }}
      run: |
        COMMAND_ID=$(aws ssm send-command \
          --region "$AWS_REGION" \
          --instance-ids "$EC2_INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --parameters commands="[
            \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY\",
            \"docker pull $ECR_REGISTRY/$ECR_REPO:latest\",
            \"docker stop $CONTAINER_NAME || true\",
            \"docker rm $CONTAINER_NAME || true\",
            \"docker run -d --name $CONTAINER_NAME --restart unless-stopped -p 3000:3000 $ECR_REGISTRY/$ECR_REPO:latest\"
          ]" \
          --query "Command.CommandId" \
          --output text)

        echo "SSM command ID: $COMMAND_ID"

        aws ssm wait command-executed \
          --region "$AWS_REGION" \
          --command-id "$COMMAND_ID" \
          --instance-id "$EC2_INSTANCE_ID"

        aws ssm get-command-invocation \
          --region "$AWS_REGION" \
          --command-id "$COMMAND_ID" \
          --instance-id "$EC2_INSTANCE_ID"
